<!DOCTYPE html>
<html>

<head>
  <title>Doctor Appointment Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      padding: 30px;
    }

    form {
      border: 2px solid gray;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
      background-color: white;
    }

    input,
    select {
      border: 1px solid gray;
      border-radius: 4px;
      padding: 6px;
      margin-bottom: 10px;
    }

    button {
      background-color: blue;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Doctor Appointment Booking</h1>
  <p>Doctor is available only from 10 AM to 10 PM.</p>

  <form onsubmit="return bookAppointment()">
    <label>Enter Name :</label>
    <input type="text" name="name" id="name">
    <br><br>

    <label>Phone Number :</label>
    <input type="text" name="phone" id="phone">
    <br><br>

    <label>Appointment Date :</label>
    <input type="date" id="apptDate">
    <br><br>

    <label>Appointment Time :</label>
    <input type="time" id="apptTime">
    <br><br>

    <button type="submit">Book Appointment</button>
    <p id="result"></p>
  </form>



  <script>
    function bookAppointment() {
      let name = document.getElementById('name').value;
      let time = document.getElementById('apptTime').value;

      let hour = parseInt(time.split(':')[0]);

      if (hour >= 22 || hour < 10) {
        alert("Sorry, doctor is not available at this time. Please select a time between 10 AM and 10 PM.");
        document.getElementById('result').innerHTML = "Booking failed: doctor not available at selected time.";
        return false;
      }

      alert("Appointment booked successfully!");
      document.getElementById('result').innerHTML = "Appointment booked for " + name + " at " + time;
      return false;
    }
  </script>
</body>

</html>
